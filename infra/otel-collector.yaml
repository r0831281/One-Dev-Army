extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  filter/secrets:
    error_mode: ignore
    logs:
      log_record:
        - 'IsMatch(body, "(?i)(authorization|api[_-]?key|secret|token)")'
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  debug:
    verbosity: basic
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/secrets, batch]
      exporters: [debug]
